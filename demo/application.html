<!doctype html>
<meta charset="utf-8">
<title>MannerHTML application tabs</title>
<script type="module" src="../dist/index.js"></script>
<manner-tabs data-activation="manual">
  <div data-tablist aria-label="Account settings">
    <button type="button" data-tab>General</button>
    <button type="button" data-tab>Privacy</button>
  </div>
  <section data-panel><h1>General</h1><p>Application content remains visible without JavaScript.</p></section>
  <section data-panel><h1>Privacy</h1><p>Press Enter or Space to activate in manual mode.</p></section>
</manner-tabs>
